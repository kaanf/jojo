[workspace]
members = ["crates/jojo-domain", "crates/jojo-helper", "crates/jojo-storage", "crates/jojo-test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
